<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SweetQR · QR Code Generator</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    --bg-1: #0b1026;
    --bg-2: #120b2e;
    --bg-3: #0a1f3a;
    --card: rgba(255, 255, 255, 0.06);
    --card-border: rgba(255, 255, 255, 0.12);
    --text: #eef1ff;
    --muted: #9aa4c7;
    --accent: #6c5ce7;
    --accent-2: #00d4ff;
    --accent-3: #f06292;
    --ok: #2ecc71;
    --radius: 18px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--text);
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(108, 92, 231, 0.35), transparent 60%),
      radial-gradient(1000px 500px at 110% 20%, rgba(0, 212, 255, 0.22), transparent 55%),
      radial-gradient(900px 700px at 50% 120%, rgba(240, 98, 146, 0.20), transparent 60%),
      linear-gradient(160deg, var(--bg-1), var(--bg-2) 55%, var(--bg-3));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    overflow-x: hidden;
  }

  .app {
    width: 100%;
    max-width: 1060px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 26px;
  }

  .brand-logo {
    width: 54px;
    height: 54px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid;
    place-items: center;
    box-shadow: 0 8px 24px rgba(108, 92, 231, 0.45);
    flex-shrink: 0;
  }

  .brand-logo svg { width: 30px; height: 30px; fill: #fff; }

  .brand h1 {
    font-size: 1.7rem;
    letter-spacing: 0.5px;
    background: linear-gradient(90deg, #fff, var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .brand p { color: var(--muted); font-size: 0.92rem; margin-top: 2px; }

  .panel {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
    padding: 26px;
  }

  .grid {
    display: grid;
    grid-template-columns: 1.15fr 0.85fr;
    gap: 26px;
    align-items: start;
  }

  @media (max-width: 860px) {
    .grid { grid-template-columns: 1fr; }
    .preview { min-height: 0; order: -1; }
  }

  @media (max-width: 520px) {
    body { padding: 16px 12px; justify-content: flex-start; }
    .panel { padding: 18px 14px; border-radius: 16px; }
    .brand { margin-bottom: 18px; gap: 12px; }
    .brand-logo { width: 46px; height: 46px; border-radius: 12px; }
    .brand-logo svg { width: 26px; height: 26px; }
    .brand h1 { font-size: 1.35rem; }
    .brand p { font-size: 0.8rem; }

    .field { flex-wrap: wrap; padding: 6px 8px 8px 12px; }
    .field svg { display: none; }
    #url { width: 100%; font-size: 1rem; padding: 10px 0 6px; }
    .field button {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      font-size: 1rem;
    }

    .modes { flex-wrap: wrap; }
    .mode { flex: 1; text-align: center; padding: 9px 12px; }

    .opt-row { grid-template-columns: 1fr; gap: 8px; }
    .opt-name { font-size: 0.82rem; }
    .colors { flex-wrap: wrap; gap: 14px; }
    .slider-wrap { gap: 10px; }
    input[type="range"] { height: 8px; }

    .preview { padding: 14px; gap: 14px; }
    .actions { flex-direction: column; gap: 10px; }
    .btn { padding: 14px; }
    .qr-meta { font-size: 0.74rem; }
    .foot { font-size: 0.75rem; }
    .toast { width: calc(100% - 32px); text-align: center; font-size: 0.85rem; }
  }

  .label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 10px;
  }

  .field {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(0, 0, 0, 0.28);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 6px 8px 6px 14px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .field:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.25);
  }

  .field svg { width: 20px; height: 20px; stroke: var(--muted); flex-shrink: 0; }

  #url {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 1.02rem;
    padding: 12px 0;
    min-width: 0;
  }

  #url::placeholder { color: #6b7399; }

  .field button {
    border: none;
    background: linear-gradient(135deg, var(--accent), #8e7bff);
    color: #fff;
    font-weight: 600;
    padding: 11px 18px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 0.92rem;
    transition: filter 0.2s, transform 0.1s;
    flex-shrink: 0;
  }

  .field button:hover { filter: brightness(1.12); }
  .field button:active { transform: scale(0.97); }

  .modes {
    display: flex;
    gap: 8px;
    margin-top: 14px;
  }

  .mode {
    background: rgba(0, 0, 0, 0.28);
    border: 1px solid var(--card-border);
    color: var(--muted);
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.2s;
  }

  .mode.active {
    background: linear-gradient(135deg, var(--accent), #8e7bff);
    color: #fff;
    border-color: transparent;
  }

  .options { margin-top: 22px; display: grid; gap: 16px; }

  .opt-row {
    display: grid;
    grid-template-columns: 150px 1fr;
    gap: 14px;
    align-items: center;
  }

  .opt-name { color: var(--muted); font-size: 0.9rem; }

  .pills { display: flex; gap: 8px; }

  .pill {
    background: rgba(0, 0, 0, 0.28);
    border: 1px solid var(--card-border);
    color: var(--muted);
    padding: 7px 14px;
    border-radius: 10px;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }

  .pill.active {
    background: var(--accent);
    border-color: transparent;
    color: #fff;
  }

  .colors { display: flex; gap: 18px; align-items: center; }

  .color-item { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 0.85rem; }

  .color-item input[type="color"] {
    width: 34px;
    height: 34px;
    border: none;
    border-radius: 9px;
    background: none;
    cursor: pointer;
    padding: 0;
  }

  .color-item input[type="color"]::-webkit-color-swatch-wrapper { padding: 2px; }
  .color-item input[type="color"]::-webkit-color-swatch { border-radius: 7px; border: none; }

  .swap {
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid var(--card-border);
    color: var(--muted);
    width: 34px;
    height: 34px;
    border-radius: 9px;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: all 0.2s;
  }

  .swap:hover { color: var(--text); border-color: var(--accent); }

  .slider-wrap { display: flex; align-items: center; gap: 14px; }

  input[type="range"] {
    flex: 1;
    accent-color: var(--accent);
    height: 6px;
    cursor: pointer;
  }

  .size-val {
    min-width: 44px;
    text-align: right;
    color: var(--text);
    font-weight: 600;
    font-size: 0.9rem;
  }

  .preview {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 18px;
    background: rgba(0, 0, 0, 0.22);
    border: 1px dashed var(--card-border);
    border-radius: 14px;
    min-height: 330px;
    justify-content: center;
    width: 100%;
  }

  .qr-stage {
    background: #fff;
    border-radius: 14px;
    padding: 10px;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
    line-height: 0;
    max-width: 100%;
    overflow: hidden;
  }

  .qr-stage canvas, .qr-stage img { border-radius: 8px; max-width: 100%; height: auto; display: block; }

  .qr-empty {
    color: var(--muted);
    text-align: center;
    font-size: 0.9rem;
    padding: 30px;
  }

  .qr-meta { color: var(--muted); font-size: 0.8rem; text-align: center; word-break: break-all; max-width: 100%; }

  .actions { display: flex; gap: 12px; width: 100%; }

  .btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 13px 14px;
    border-radius: 12px;
    border: none;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: filter 0.2s, transform 0.1s;
  }

  .btn svg { width: 18px; height: 18px; }

  .btn:active { transform: scale(0.97); }

  .btn-primary { background: linear-gradient(135deg, var(--accent), #8e7bff); color: #fff; }
  .btn-primary:hover { filter: brightness(1.12); }
  .btn-ghost { background: rgba(0, 0, 0, 0.3); color: var(--text); border: 1px solid var(--card-border); }
  .btn-ghost:hover { border-color: var(--accent); }

  .toast {
    position: fixed;
    bottom: 26px;
    left: 50%;
    transform: translate(-50%, 80px);
    background: var(--ok);
    color: #04260f;
    font-weight: 600;
    padding: 13px 22px;
    border-radius: 12px;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
    opacity: 0;
    transition: all 0.3s ease;
    z-index: 50;
    font-size: 0.92rem;
  }

  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .foot {
    margin-top: 22px;
    text-align: center;
    color: var(--muted);
    font-size: 0.82rem;
  }

  .foot b { color: var(--accent-2); font-weight: 600; }
</style>
</head>
<body>

<main class="app">
  <header class="brand">
    <div class="brand-logo">
      <svg viewBox="0 0 24 24"><path d="M3 3h7v7H3V3zm1 1v5h5V4H4zm2 2h1v1H6V6zm9-3h6v6h-6V3zm1 1v4h4V4h-4zm2 2h1v1h-1V6zM3 14h7v7H3v-7zm1 1v5h5v-5H4zm2 2h1v1H6v-1zm9-3h6v6h-6v-6zm1 1v4h4v-4h-4zm2 2h1v1h-1v-1z"/></svg>
    </div>
    <div>
      <h1>SweetQR</h1>
      <p>Generate QR codes instantly, right in your browser</p>
    </div>
  </header>

  <section class="panel">
    <div class="grid">
      <div>
        <label class="label" for="url">QR content</label>
        <div class="field">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          <input id="url" type="text" inputmode="url" placeholder="https://your-website.com" autocomplete="off" spellcheck="false">
          <button id="apply">Generate</button>
        </div>

        <div class="modes">
          <button class="mode active" data-mode="url">URL</button>
          <button class="mode" data-mode="text">Free text</button>
        </div>

        <div class="options">
          <div class="opt-row">
            <span class="opt-name">Error correction</span>
            <div class="pills" id="ec-pills">
              <button class="pill" data-ec="L">L · 7%</button>
              <button class="pill" data-ec="M">M · 15%</button>
              <button class="pill active" data-ec="Q">Q · 25%</button>
              <button class="pill" data-ec="H">H · 30%</button>
            </div>
          </div>

          <div class="opt-row">
            <span class="opt-name">Colors</span>
            <div class="colors">
              <div class="color-item"><input id="colorDark" type="color" value="#0b1026"><span>Background</span></div>
              <button class="swap" id="swapColors" title="Swap colors" aria-label="Swap colors">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 16V4m0 0L3 8m4-4 4 4M17 8v12m0 0 4-4m-4 4-4-4"/></svg>
              </button>
              <div class="color-item"><input id="colorLight" type="color" value="#ffffff"><span>QR</span></div>
            </div>
          </div>

          <div class="opt-row">
            <span class="opt-name">Size</span>
            <div class="slider-wrap">
              <input id="size" type="range" min="180" max="620" step="10" value="300">
              <span class="size-val" id="sizeVal">300px</span>
            </div>
          </div>
        </div>
      </div>

      <div class="preview">
        <div class="qr-stage" id="qrStage">
          <div class="qr-empty" id="qrEmpty">Enter a URL to see the QR here</div>
        </div>
        <div class="qr-meta" id="qrMeta"></div>
        <div class="actions">
          <button class="btn btn-primary" id="download">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Download PNG
          </button>
          <button class="btn btn-ghost" id="copy">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            Copy
          </button>
        </div>
      </div>
    </div>
  </section>

  <p class="foot">Made with <b>&hearts;</b> at SweetCode &mdash; QR codes that last forever</p>
</main>

<div class="toast" id="toast">Listo</div>

<script src="vendor/qrcode.min.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const urlInput = $("url");
  const applyBtn = $("apply");
  const stage = $("qrStage");
  const empty = $("qrEmpty");
  const meta = $("qrMeta");
  const toast = $("toast");
  const sizeInput = $("size");
  const sizeVal = $("sizeVal");
  const bgColor = $("colorDark");
  const fgColor = $("colorLight");

  let mode = "url";
  let ec = "Q";
  let timer = null;

  const EC_MAP = {
    L: QRCode.CorrectLevel.L,
    M: QRCode.CorrectLevel.M,
    Q: QRCode.CorrectLevel.Q,
    H: QRCode.CorrectLevel.H
  };

  function normalize(text) {
    if (mode === "url") {
      const t = text.trim();
      if (!t) return "";
      if (!/^https?:\/\//i.test(t)) return "https://" + t;
      return t;
    }
    return text;
  }

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(timer);
    timer = setTimeout(() => toast.classList.remove("show"), 2200);
  }

  function render() {
    const text = normalize(urlInput.value);
    stage.innerHTML = "";
    meta.textContent = "";

    if (!text) {
      stage.appendChild(empty);
      empty.style.display = "";
      return;
    }

    const size = parseInt(sizeInput.value, 10);
    const qr = new QRCode(stage, {
      text: text,
      width: size,
      height: size,
      colorDark: fgColor.value,
      colorLight: bgColor.value,
      correctLevel: EC_MAP[ec],
      useSVG: false
    });
    meta.textContent = (mode === "url" ? "URL: " : "Texto: ") + text;
    qr._oDrawing._elImage.style.display = "none";
    qr._oDrawing._elCanvas.style.display = "";
  }

  function renderHiRes(width) {
    const holder = document.createElement("div");
    holder.style.position = "absolute";
    holder.style.left = "-9999px";
    document.body.appendChild(holder);
    const qr = new QRCode(holder, {
      text: normalize(urlInput.value),
      width: width,
      height: width,
      colorDark: fgColor.value,
      colorLight: bgColor.value,
      correctLevel: EC_MAP[ec],
      useSVG: false
    });
    const canvas = qr._oDrawing._elCanvas;
    const dataUrl = canvas.toDataURL("image/png");
    document.body.removeChild(holder);
    return dataUrl;
  }

  applyBtn.addEventListener("click", render);

  urlInput.addEventListener("input", function () {
    clearTimeout(timer);
    timer = setTimeout(render, 300);
  });

  urlInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") render();
  });

  document.querySelectorAll(".mode").forEach(function (btn) {
    btn.addEventListener("click", function () {
      document.querySelectorAll(".mode").forEach(function (b) { b.classList.remove("active"); });
      btn.classList.add("active");
      mode = btn.dataset.mode;
      urlInput.placeholder = mode === "url" ? "https://your-website.com" : "Type any text...";
      render();
    });
  });

  document.querySelectorAll(".pill").forEach(function (btn) {
    btn.addEventListener("click", function () {
      document.querySelectorAll(".pill").forEach(function (b) { b.classList.remove("active"); });
      btn.classList.add("active");
      ec = btn.dataset.ec;
      render();
    });
  });

  bgColor.addEventListener("input", render);
  fgColor.addEventListener("input", render);

  $("swapColors").addEventListener("click", function () {
    const d = bgColor.value;
    bgColor.value = fgColor.value;
    fgColor.value = d;
    render();
  });

  sizeInput.addEventListener("input", function () {
    sizeVal.textContent = sizeInput.value + "px";
    render();
  });

  $("download").addEventListener("click", function () {
    if (!normalize(urlInput.value)) { showToast("Enter a URL first"); return; }
    const dataUrl = renderHiRes(1024);
    const a = document.createElement("a");
    a.href = dataUrl;
    a.download = "sweetqr.png";
    a.click();
    showToast("PNG downloaded");
  });

  $("copy").addEventListener("click", function () {
    if (!normalize(urlInput.value)) { showToast("Enter a URL first"); return; }
    const holder = document.createElement("div");
    document.body.appendChild(holder);
    const qr = new QRCode(holder, {
      text: normalize(urlInput.value),
      width: 512,
      height: 512,
      colorDark: fgColor.value,
      colorLight: bgColor.value,
      correctLevel: EC_MAP[ec],
      useSVG: false
    });
    const canvas = qr._oDrawing._elCanvas;
    if (canvas.toBlob && navigator.clipboard && navigator.clipboard.write) {
      canvas.toBlob(function (blob) {
        navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]).then(function () {
          showToast("QR copied to clipboard");
        }).catch(function () {
          showToast("Couldn't copy");
        });
      }, "image/png");
    } else {
      showToast("Your browser doesn't support copying images");
    }
    document.body.removeChild(holder);
  });

  if (localStorage.getItem("sweetqr:url")) {
    urlInput.value = localStorage.getItem("sweetqr:url");
    render();
  }
  urlInput.addEventListener("blur", function () {
    localStorage.setItem("sweetqr:url", urlInput.value);
  });

  render();
})();
</script>
</body>
</html>
